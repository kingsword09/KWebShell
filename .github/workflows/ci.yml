name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Identify event scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      graphs: ${{ steps.changes.outputs.graphs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect exact event changes
        id: changes
        run: python3 .github/scripts/ci_plan.py changes --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --output build/ci/changes.json
      - uses: actions/upload-artifact@v6
        with:
          name: ci-changes-${{ github.sha }}
          path: build/ci/changes.json
          if-no-files-found: error
          retention-days: 14

  graphs:
    name: Inspect Gradle graph (${{ matrix.target }})
    needs: [scope]
    if: needs.scope.outputs.graphs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Export the scheduled graph without native execution
        shell: bash
        run: bash .github/scripts/export-ci-graph.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ci-graph-${{ matrix.target }}
          path: build/ci/graph.json
          if-no-files-found: error
          retention-days: 14

  plan:
    name: Plan affected verification
    needs: [scope, graphs]
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.graphs.result == 'success' || needs.scope.outputs.graphs == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verify: ${{ steps.plan.outputs.verify || steps.docs.outputs.verify }}
      refresh: ${{ steps.plan.outputs.refresh || steps.docs.outputs.refresh }}
      full: ${{ steps.plan.outputs.full || steps.docs.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        if: needs.scope.outputs.graphs == 'true'
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        if: needs.scope.outputs.graphs == 'true'
      - uses: actions/download-artifact@v7
        with:
          name: ci-changes-${{ github.sha }}
          path: build/ci/
      - name: Plan documentation without native platform jobs
        if: needs.scope.outputs.graphs == 'false'
        id: docs
        run: python3 .github/scripts/ci_plan.py docs --changes build/ci/changes.json --output build/ci/plan.json
      - name: Download all platform graphs
        if: needs.scope.outputs.graphs == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: ci-graph-*
          path: build/ci/platforms/
      - name: Merge actual platform dependencies
        if: needs.scope.outputs.graphs == 'true'
        run: python3 .github/scripts/ci_plan.py merge-graphs --directory build/ci/platforms --output build/ci/graph.json
      - name: Select verification and evidence producers
        if: needs.scope.outputs.graphs == 'true'
        id: plan
        run: python3 .github/scripts/ci_plan.py plan --graph build/ci/graph.json --changes build/ci/changes.json --output build/ci/plan.json
      - uses: actions/upload-artifact@v6
        with:
          name: ci-plan-${{ github.sha }}
          path: build/ci/
          if-no-files-found: error
          retention-days: 14

  lightweight:
    name: Check CI contracts and documentation
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test CI policy and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-policy
          python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v 2>&1 | tee build/ci-policy/tests.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-policy-tests-${{ github.sha }}
          path: build/ci-policy/
          if-no-files-found: error
          retention-days: 14
      - name: Check diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^
          fi
      - name: Test RFC contracts before refreshing hosted evidence
        if: needs.plan.outputs.refresh == 'true'
        run: ./gradlew --no-daemon :kweb-rfc-governance:contractTest
      - name: Validate current evidence without native execution
        if: needs.plan.outputs.refresh != 'true'
        run: ./gradlew --no-daemon :kweb-rfc-governance:check

  verify:
    name: Verify (${{ matrix.target }}, ${{ matrix.gpu-contract }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.verify == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: '["macos-15"]'
            gpu-contract: hardware GPU contract
            expect-hardware-gpu-unavailable: false
            benchmark-machine-class: unused
            run-application-benchmark: false
            run-live-html5: false
          - target: windows-x64
            runner: '["windows-2022"]'
            gpu-contract: GPU unavailable contract
            expect-hardware-gpu-unavailable: true
            benchmark-machine-class: github-hosted-windows-2022-x64
            run-application-benchmark: true
            run-live-html5: true
          - target: linux-x64
            runner: '["ubuntu-24.04"]'
            gpu-contract: GPU unavailable contract
            expect-hardware-gpu-unavailable: true
            benchmark-machine-class: unused
            run-application-benchmark: false
            run-live-html5: false
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The platform audit re-runs the planner, which resolves the PR base
          # commit to recognize a new-module registration; a shallow checkout
          # cannot and would fail closed with ci.git-input.
          fetch-depth: 0

      - name: Download the execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-plan-${{ github.sha }}
          path: build/ci/

      - name: Set up Python for cross-platform planning
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure line endings for deterministic contract digests
        run: git config --local core.eol lf

      - name: Set up JDK 25 runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Audit the actual platform task graph
        id: scope
        shell: bash
        run: |
          bash .github/scripts/export-ci-graph.sh
          python3 .github/scripts/ci_plan.py audit --plan build/ci/plan.json --graph build/ci/graph.json --output build/ci/audit.json --target '${{ matrix.target }}'
          for feature in cef native node notifications shell screen msix benchmark liveHtml5; do
            echo "$feature=$(jq -r --arg name "$feature" '.features[$name]' build/ci/audit.json | tr -d '\r')" >> "$GITHUB_OUTPUT"
          done
          for family in $(jq -r '.families[]' build/ci/plan.json | tr -d '\r'); do
            echo "$family=true" >> "$GITHUB_OUTPUT"
          done

      - name: Set up Node.js 24 LTS
        if: steps.scope.outputs.node == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned TypeScript compiler
        if: steps.scope.outputs.node == 'true'
        run: npm ci

      - name: Set up MSVC
        if: runner.os == 'Windows' && steps.scope.outputs.native == 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows MSIX preflight isolation
        if: runner.os == 'Windows' && steps.scope.outputs.msix == 'true'
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .github/scripts/tests/test_windows_msix_preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSIX preflight isolation failed.' }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .github/scripts/tests/test_windows_msix_activation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSIX native activation diagnostics failed.' }

      - name: Start macOS notification fixture agent
        if: runner.os == 'macOS' && steps.scope.outputs.notifications == 'true'
        shell: bash
        run: bash .github/scripts/configure-macos-notification-fixture.sh

      - name: Register Windows notification fixture identity
        id: windows-notification-identity
        if: runner.os == 'Windows' && steps.scope.outputs.notifications == 'true'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .github/scripts/configure-windows-notification-fixture.ps1

      - name: Verify Windows notification fixture through the native ABI
        if: runner.os == 'Windows' && steps.scope.outputs.notifications == 'true'
        shell: pwsh
        run: |
          cmake -S kweb-service-notifications/native -B kweb-service-notifications/build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DKWEB_PROJECT_ARCH=x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Notification native configuration failed.' }
          cmake --build kweb-service-notifications/build/native --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Notification native build failed.' }
          & kweb-service-notifications/build/native/contract/kweb_notifications_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Notification native contract tests failed.' }
          & kweb-service-notifications/build/native/contract/kweb_notifications_tests.exe --fixture-permission
          if ($LASTEXITCODE -ne 0) { throw 'Notification native fixture permission failed.' }

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && steps.scope.outputs.native == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dbus-x11 \
            libasound2-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libnss3-tools \
            openbox \
            desktop-file-utils \
            x11-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-gtk \
            xdg-user-dirs \
            xvfb
          xdg-user-dirs-update

      - name: Configure Linux shell provider fixture
        if: runner.os == 'Linux' && steps.scope.outputs.shell == 'true'
        shell: bash
        run: .github/scripts/configure-linux-shell-fixture.sh

      - name: Verify native build prerequisites
        if: steps.scope.outputs.native == 'true'
        shell: bash
        run: |
          java -version
          cmake --version
          ninja --version

      - name: Verify an isolated native selection before provisioning CEF
        if: needs.plan.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_plan.py probe --graph build/ci/graph.json --output build/ci/tray-selection-probe.json
          roots=()
          while IFS= read -r task; do
            roots+=("$task")
          done < <(jq -r '.plan.roots[]' build/ci/tray-selection-probe.json | tr -d '\r')
          if [[ "${{ runner.os }}" == Linux ]]; then
            XDG_CURRENT_DESKTOP=GNOME xvfb-run -a dbus-run-session -- \
              bash .github/scripts/run-linux-ui-verification.sh ./gradlew --no-daemon --max-workers=1 -I .github/ci/fresh-verification.gradle "${roots[@]}" | tee build/ci/tray-selection-probe.log
          else
            ./gradlew --no-daemon --max-workers=1 -I .github/ci/fresh-verification.gradle "${roots[@]}" | tee build/ci/tray-selection-probe.log
          fi

      - name: Resolve pinned CEF artifact
        if: steps.scope.outputs.cef == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(jq -er --arg target '${{ matrix.target }}' \
            '.artifacts[] | select(.target == $target)' runtime/cef-runtime.json)"
          archive="$(jq -er '.fileName' <<<"$artifact" | tr -d '\r')"
          directory="${archive%.tar.bz2}"
          {
            echo "CEF_ARCHIVE=$archive"
            echo "CEF_DIRECTORY=$directory"
          } >> "$GITHUB_ENV"

      - name: Cache pinned CEF archive
        if: steps.scope.outputs.cef == 'true'
        uses: actions/cache@v6
        with:
          path: .cef-ci/archives
          key: cef-${{ matrix.target }}-${{ hashFiles('runtime/cef-runtime.json') }}

      - name: Download pinned CEF archive
        if: steps.scope.outputs.cef == 'true'
        shell: bash
        run: |
          mkdir -p .cef-ci/archives
          archive=".cef-ci/archives/$CEF_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$archive" \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE"
          fi

      - name: Verify pinned CEF archive
        if: steps.scope.outputs.cef == 'true'
        shell: bash
        run: |
          ./gradlew --no-daemon :kweb-runtime-pack:verifyCefRuntimeArtifact \
            -PkwebTarget=${{ matrix.target }} \
            -PcefRuntimeArchive="$PWD/.cef-ci/archives/$CEF_ARCHIVE"

      - name: Extract verified CEF archive
        if: steps.scope.outputs.cef == 'true'
        shell: bash
        run: |
          mkdir -p .cef-ci/source
          tar -xjf ".cef-ci/archives/$CEF_ARCHIVE" \
            -C .cef-ci/source

      - name: Run application workload benchmark
        if: matrix.run-application-benchmark && steps.scope.outputs.benchmark == 'true'
        shell: bash
        run: |
          ./gradlew --no-daemon :kweb-example-app-benchmark:applicationBenchmarkIntegrationTest \
            -PcefRoot="$PWD/.cef-ci/source/$CEF_DIRECTORY" \
            -PkwebBenchmarkMachineClass=${{ matrix.benchmark-machine-class }}

      - name: Upload application benchmark evidence
        if: matrix.run-application-benchmark && steps.scope.outputs.benchmark == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: application-benchmark-${{ matrix.target }}-${{ github.sha }}
          path: kweb-example-app-benchmark/build/reports/application-benchmark/
          if-no-files-found: error
          retention-days: 14

      - name: Run live HTML5test example
        if: matrix.run-live-html5 && steps.scope.outputs.liveHtml5 == 'true'
        shell: bash
        run: |
          ./gradlew --no-daemon :kweb-example-html5-lab:html5TestSiteRun \
            -PcefRoot="$PWD/.cef-ci/source/$CEF_DIRECTORY"

      - name: Upload live HTML5test evidence
        if: matrix.run-live-html5 && steps.scope.outputs.liveHtml5 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: html5test-${{ matrix.target }}-${{ github.sha }}
          path: kweb-example-html5-lab/build/reports/html5test-site/
          if-no-files-found: error
          retention-days: 14

      - name: Run runtime, native, unit and packaging verification
        shell: bash
        run: |
          arguments=(
            --no-daemon
            --max-workers=1
            -I .github/ci/fresh-verification.gradle
            -PkwebNotificationActionMode=contract
            "-PkwebExpectHardwareGpuUnavailable=${{ matrix.expect-hardware-gpu-unavailable }}"
          )
          while IFS= read -r task; do
            case "$task" in
              :kweb-example-app-benchmark:applicationBenchmarkIntegrationTest|:kweb-example-html5-lab:html5TestSiteRun) ;;
              *) arguments+=("$task") ;;
            esac
          done < <(jq -r '.roots[]' build/ci/plan.json | tr -d '\r')
          if [[ "${{ steps.scope.outputs.cef }}" == true ]]; then
            arguments+=("-PcefRoot=$PWD/.cef-ci/source/$CEF_DIRECTORY")
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            arguments+=(--no-configuration-cache)
          fi
          if [[ "${{ runner.os }}" == "Linux" && "${{ steps.scope.outputs.native }}" == true ]]; then
            XDG_CURRENT_DESKTOP=GNOME xvfb-run -a dbus-run-session -- \
              bash .github/scripts/run-linux-ui-verification.sh ./gradlew "${arguments[@]}"
          else
            ./gradlew "${arguments[@]}"
          fi

      - name: Upload native dialog evidence
        if: always() && steps.scope.outputs['native-dialogs'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: native-dialogs-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-dialogs/build/reports/native-dialog-ui/
            kweb-service-dialogs/build/reports/dialogs-cef-ui/
            kweb-service-dialogs/build/dialogs-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Upload engine integration evidence
        if: always() && steps.scope.outputs['engine-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: engine-integration-${{ matrix.target }}-${{ github.sha }}
          path: kweb-desktop/build/engine-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Upload provider lifecycle evidence
        if: always() && steps.scope.outputs['provider-lifecycle'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: provider-lifecycle-${{ matrix.target }}-${{ github.sha }}
          path: kweb-service-window-controls/build/window-controls-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Electron migration evidence
        if: always() && steps.scope.outputs['electron-migration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: electron-migration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-electron-migration/build/reports/electron-migration/
            kweb-electron-migration/build/migration-integration/
            kweb-electron-migration/build/test-results/jvmTest/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload clipboard evidence
        if: always() && steps.scope.outputs['clipboard'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: clipboard-${{ matrix.target }}-${{ github.sha }}
          path: kweb-service-clipboard/build/clipboard-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native image evidence
        if: always() && steps.scope.outputs['image-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: image-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-image/build/reports/image-integration/
            kweb-service-image/build/reports/image-native-tests.xml
            kweb-service-image/build/test-results/jvmTest/*.xml
            kweb-service-image/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload native menus evidence
        if: always() && steps.scope.outputs['menus-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: menus-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-menus/build/reports/menus-integration/
            kweb-service-menus/build/reports/menus-native-tests.xml
            kweb-service-menus/build/test-results/jvmTest/*.xml
            kweb-service-menus/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload native tray evidence
        if: always() && steps.scope.outputs['tray-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: tray-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-tray/build/reports/tray-integration/
            kweb-service-tray/build/reports/tray-native-tests.xml
            kweb-service-tray/build/test-results/jvmTest/*.xml
            kweb-service-tray/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload system-preferences evidence
        if: always() && steps.scope.outputs['preferences-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: preferences-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-system-preferences/build/reports/preferences-integration/
            kweb-service-system-preferences/build/reports/preferences-native-tests.xml
            kweb-service-system-preferences/build/test-results/jvmTest/*.xml
            kweb-service-system-preferences/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify the Wayland screen session
        if: runner.os == 'Linux' && steps.scope.outputs.screen == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A compositor publishes the monitors GDK reports; the headless backend is
          # the declared facility of this verification.
          sudo apt-get update -qq
          sudo apt-get install -y -qq weston
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/kweb-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=kweb-screen --width=1600 --height=1200 --idle-time=0 &
          sleep 5
          transcript="kweb-service-screen/build/reports/screen-integration/screen-wayland-transcript.txt"
          mkdir -p "$(dirname "$transcript")"
          unset DISPLAY
          GDK_BACKEND=wayland WAYLAND_DISPLAY=kweb-screen \
            kweb-service-screen/build/native/contract/kweb_screen_tests | tee "$transcript"

      - name: Upload screen evidence
        if: always() && steps.scope.outputs['screen-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: screen-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-screen/build/reports/screen-integration/
            kweb-service-screen/build/reports/screen-native-tests.xml
            kweb-service-screen/build/test-results/jvmTest/*.xml
            kweb-service-screen/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload shortcuts evidence
        if: always() && steps.scope.outputs['shortcuts-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: shortcuts-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-shortcuts/build/reports/shortcuts-integration/
            kweb-service-shortcuts/build/reports/shortcuts-native-tests.xml
            kweb-service-shortcuts/build/test-results/jvmTest/*.xml
            kweb-service-shortcuts/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload power evidence
        if: always() && steps.scope.outputs['power-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: power-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-power/build/reports/power-integration/
            kweb-service-power/build/reports/power-native-tests.xml
            kweb-service-power/build/test-results/jvmTest/*.xml
            kweb-service-power/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload secure-storage evidence
        if: always() && steps.scope.outputs['secure-storage-integration'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: secure-storage-integration-${{ matrix.target }}-${{ github.sha }}
          path: |
            kweb-service-secure-storage/build/reports/secure-storage-integration/
            kweb-service-secure-storage/build/reports/secure-storage-native-tests.xml
            kweb-service-secure-storage/build/test-results/jvmTest/*.xml
            kweb-service-secure-storage/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload application package evidence
        if: always() && steps.scope.outputs['application-package'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: application-package-${{ matrix.target }}-${{ github.sha }}
          path: kweb-runtime-pack/build/reports/application-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows launcher smoke evidence
        if: always() && runner.os == 'Windows' && steps.scope.outputs['windows-launcher-smoke'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-launcher-smoke-${{ matrix.target }}-${{ github.sha }}
          path: kweb-application-launcher/build/reports/windows-launcher-smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Upload application lifecycle evidence
        if: always() && steps.scope.outputs['application-lifecycle'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: application-lifecycle-${{ matrix.target }}-${{ github.sha }}
          path: kweb-service-application-lifecycle/build/reports/application-lifecycle/
          if-no-files-found: error
          retention-days: 14

      - name: Upload RFC governance contract-test evidence
        if: always() && steps.scope.outputs['rfc-governance'] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: rfc-governance-${{ matrix.target }}-${{ github.sha }}
          path: kweb-rfc-governance/build/test-results/contractTest/
          if-no-files-found: error
          retention-days: 14

      - name: Retain platform plan and task audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-audit-${{ matrix.target }}-${{ github.sha }}
          path: build/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Remove Windows notification fixture identity
        if: always() && runner.os == 'Windows' && steps.windows-notification-identity.outcome == 'success'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .github/scripts/configure-windows-notification-fixture.ps1 -Cleanup

  governance:
    name: Verify checked-in RFC evidence
    needs: [plan, lightweight, verify, rfc-evidence]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lightweight.result == 'success' && (needs.verify.result == 'success' || needs.plan.outputs.verify == 'false') && (needs.rfc-evidence.result == 'success' || needs.plan.outputs.refresh == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify the checked-in evidence manifest
        shell: bash
        run: ./gradlew --no-daemon :kweb-rfc-governance:rfcGovernanceCheck

      - name: Download freshly recorded RFC evidence
        if: needs.plan.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fresh-rfc-evidence/manifest build/fresh-rfc-evidence/artifacts
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "rfc-evidence-manifest-${{ github.sha }}" \
            --dir build/fresh-rfc-evidence/manifest
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "rfc-evidence-artifacts-${{ github.sha }}" \
            --dir build/fresh-rfc-evidence/artifacts
          manifest="$(find build/fresh-rfc-evidence/manifest -type f -name manifest.json -print -quit)"
          test -n "$manifest"
          cp "$manifest" docs/rfcs/evidence/manifest.json
          artifact_root="$(find build/fresh-rfc-evidence/artifacts -type d -name artifacts -print -quit)"
          test -n "$artifact_root"
          mkdir -p docs/rfcs/evidence/artifacts
          cp -R "$artifact_root/." docs/rfcs/evidence/artifacts/
      - name: Check strict governance and repository evidence
        run: ./gradlew --no-daemon :kweb-rfc-governance:check
      - name: Retain governance findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checked-in-rfc-governance-${{ github.sha }}
          path: kweb-rfc-governance/build/reports/rfc-governance/
          if-no-files-found: error
          retention-days: 14

  rfc-evidence:
    name: Record hosted RFC evidence
    needs: [plan, lightweight, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lightweight.result == 'success' && needs.verify.result == 'success' && needs.plan.outputs.refresh == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download the recording plan
        uses: actions/download-artifact@v7
        with:
          name: ci-plan-${{ github.sha }}
          path: build/ci/

      - name: Download hosted verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p build/rfc-evidence/downloaded
          for family in $(jq -r '.families[]' build/ci/plan.json); do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$family-*-${{ github.sha }}" \
              --dir "build/rfc-evidence/downloaded/$family"
          done
          if jq -e '.refreshRfcs | index("0001") != null' build/ci/plan.json > /dev/null; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ci-audit-*-${{ github.sha }}' --dir build/rfc-evidence/downloaded/ci-audits
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ci-policy-tests-${{ github.sha }}' --dir build/rfc-evidence/downloaded/ci-policy-tests-${{ github.sha }}
          fi
          find build/rfc-evidence/downloaded -type f | sort

      - name: Test RFC evidence aggregation
        shell: bash
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Record hosted RFC evidence
        shell: bash
        run: .github/scripts/aggregate-rfc-evidence.sh build/ci/plan.json

      - name: Verify freshly recorded evidence
        run: ./gradlew --no-daemon :kweb-rfc-governance:check

      - name: Upload merged RFC evidence manifest
        uses: actions/upload-artifact@v6
        with:
          name: rfc-evidence-manifest-${{ github.sha }}
          path: docs/rfcs/evidence/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload merged RFC evidence artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rfc-evidence-artifacts-${{ github.sha }}
          path: docs/rfcs/evidence/artifacts/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI Gate
    needs: [scope, graphs, plan, lightweight, verify, rfc-evidence, governance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ci-plan-${{ github.sha }}
          path: build/ci/
      - name: Reject failed or skipped required verification
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          EVIDENCE_RESULT: ${{ needs.rfc-evidence.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          GRAPHS_RESULT: ${{ needs.graphs.result }}
          GRAPHS_REQUIRED: ${{ needs.scope.outputs.graphs }}
        shell: bash
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$GRAPHS_REQUIRED" == true ]]; then
            test "$GRAPHS_RESULT" = success
          else
            test "$GRAPHS_REQUIRED" = false
            test "$GRAPHS_RESULT" = skipped
          fi
          jq -n --arg plan "$PLAN_RESULT" --arg lightweight "$LIGHTWEIGHT_RESULT" --arg verify "$VERIFY_RESULT" --arg evidence "$EVIDENCE_RESULT" --arg governance "$GOVERNANCE_RESULT" '{plan:$plan,lightweight:$lightweight,verify:$verify,"rfc-evidence":$evidence,governance:$governance}' > build/ci/results.json
          python3 .github/scripts/ci_plan.py gate --plan build/ci/plan.json --results build/ci/results.json
