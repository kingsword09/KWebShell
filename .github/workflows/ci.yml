name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.target }}, ${{ matrix.gpu-contract }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            gpu-contract: GPU unavailable contract
            expect-hardware-gpu-unavailable: true
          - target: windows-x64
            os: windows-2022
            gpu-contract: GPU unavailable contract
            expect-hardware-gpu-unavailable: true
          - target: macos-arm64
            os: macos-15
            gpu-contract: GPU required
            expect-hardware-gpu-unavailable: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 probe and JDK 21 production runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned TypeScript compiler
        shell: bash
        run: npm ci

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgtk-3-dev xvfb

      - name: Verify native build prerequisites
        shell: bash
        run: |
          java -version
          cmake --version
          ninja --version

      - name: Resolve pinned CEF artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(jq -er --arg target '${{ matrix.target }}' \
            '.artifacts[] | select(.target == $target)' runtime/cef-runtime.json)"
          archive="$(jq -er '.fileName' <<<"$artifact")"
          directory="${archive%.tar.bz2}"
          {
            echo "CEF_ARCHIVE=$archive"
            echo "CEF_DIRECTORY=$directory"
          } >> "$GITHUB_ENV"

      - name: Cache pinned CEF archive
        uses: actions/cache@v6
        with:
          path: .cef-ci/archives
          key: cef-${{ matrix.target }}-${{ hashFiles('runtime/cef-runtime.json') }}

      - name: Download pinned CEF archive
        shell: bash
        run: |
          mkdir -p .cef-ci/archives
          archive=".cef-ci/archives/$CEF_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$archive" \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE"
          fi

      - name: Verify pinned CEF archive
        shell: bash
        run: |
          ./gradlew --no-daemon :kweb-runtime-pack:verifyCefRuntimeArtifact \
            -PkwebTarget=${{ matrix.target }} \
            -PcefRuntimeArchive="$PWD/.cef-ci/archives/$CEF_ARCHIVE"

      - name: Extract verified CEF archive
        shell: bash
        run: |
          mkdir -p .cef-ci/source
          tar -xjf ".cef-ci/archives/$CEF_ARCHIVE" \
            -C .cef-ci/source

      - name: Run complete verification
        shell: bash
        run: |
          ./gradlew --no-daemon check \
            -PcefRoot="$PWD/.cef-ci/source/$CEF_DIRECTORY" \
            -PkwebExpectHardwareGpuUnavailable=${{ matrix.expect-hardware-gpu-unavailable }}

      - name: Upload interop benchmark evidence
        uses: actions/upload-artifact@v6
        with:
          name: kwebshell-interop-benchmark-${{ matrix.target }}-${{ github.sha }}
          path: kweb-interop-probe/build/reports/interop-benchmark/results.json
          if-no-files-found: error
          retention-days: 14
