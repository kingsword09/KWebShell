name: Custom CEF Source Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner-os: macOS
            runner-arch: ARM64
            install-linux-dependencies: false
            expect-hardware-gpu-unavailable: false
          - target: windows-x64
            runner-os: Windows
            runner-arch: X64
            install-linux-dependencies: false
            expect-hardware-gpu-unavailable: true
          - target: linux-x64
            runner-os: Linux
            runner-arch: X64
            install-linux-dependencies: true
            expect-hardware-gpu-unavailable: true
    runs-on:
      - self-hosted
      - kwebshell-cef-build
      - ${{ matrix.runner-os }}
      - ${{ matrix.runner-arch }}
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set isolated build paths
        shell: bash
        run: |
          echo "KWEB_CEF_WORK_DIR=$RUNNER_TEMP/kwebshell-cef-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "KWEB_CEF_OUTPUT_DIR=$RUNNER_TEMP/kwebshell-cef-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Verify source-build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python --version
          git --version
          cmake --version
          ninja --version
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            unzip -v >/dev/null
          fi
          test ! -e "$KWEB_CEF_WORK_DIR"
          test ! -e "$KWEB_CEF_OUTPUT_DIR"

      - name: Verify pinned source and build contracts
        shell: bash
        run: ./gradlew --no-daemon :kweb-runtime-pack:check

      - name: Build checksum-pinned custom CEF
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --work-dir "$KWEB_CEF_WORK_DIR"
            --output-dir "$KWEB_CEF_OUTPUT_DIR"
            --target "${{ matrix.target }}"
          )
          if [[ "${{ matrix.install-linux-dependencies }}" == "true" ]]; then
            arguments+=(--install-linux-dependencies)
          fi
          python runtime/cef/build-custom-runtime.py "${arguments[@]}"

      - name: Extract custom CEF for lifecycle verification
        shell: bash
        run: |
          set -euo pipefail
          archive_count="$(find "$KWEB_CEF_OUTPUT_DIR" -maxdepth 1 -type f -name '*.zip' -print | wc -l | tr -d ' ')"
          [[ "$archive_count" -eq 1 ]]
          archive="$(find "$KWEB_CEF_OUTPUT_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          extraction="$RUNNER_TEMP/kwebshell-cef-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}"
          mkdir "$extraction"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python -m zipfile -e "$archive" "$extraction"
          else
            unzip -q "$archive" -d "$extraction"
          fi
          root_count="$(find "$extraction" -mindepth 1 -maxdepth 1 -type d -name 'cef_binary_*_minimal' -print | wc -l | tr -d ' ')"
          [[ "$root_count" -eq 1 ]]
          root="$(find "$extraction" -mindepth 1 -maxdepth 1 -type d -name 'cef_binary_*_minimal' -print -quit)"
          echo "KWEB_CUSTOM_CEF_ROOT=$root" >> "$GITHUB_ENV"

      - name: Run real MV3 native and lifecycle acceptance
        shell: bash
        run: |
          ./gradlew --no-daemon :kweb-cef-native:nativeTest \
            -PcefRoot="$KWEB_CUSTOM_CEF_ROOT" \
            -PkwebExpectCustomExtensionRuntime=true \
            -PkwebExpectHardwareGpuUnavailable=${{ matrix.expect-hardware-gpu-unavailable }}
          ./gradlew --no-daemon :kweb-desktop:extensionLifecycleIntegrationTest \
            -PcefRoot="$KWEB_CUSTOM_CEF_ROOT" \
            -PkwebExpectCustomExtensionRuntime=true \
            -PkwebExpectHardwareGpuUnavailable=${{ matrix.expect-hardware-gpu-unavailable }}

      - name: Upload verified runtime and provenance
        uses: actions/upload-artifact@v6
        with:
          name: kwebshell-custom-cef-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kwebshell-cef-output-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/*.zip
            ${{ runner.temp }}/kwebshell-cef-output-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/*.metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
