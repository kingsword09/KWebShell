name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/rfcs/**"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/rfcs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Documentation and RFC governance check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25 runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check documentation formatting
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD

      - name: Run RFC governance and schema validation
        shell: bash
        run: ./gradlew --no-daemon :kweb-rfc-governance:rfcGovernanceCheck

      - name: Upload RFC governance report
        uses: actions/upload-artifact@v6
        with:
          name: rfc-governance-docs-${{ github.sha }}
          path: kweb-rfc-governance/build/reports/rfc-governance/
          if-no-files-found: error
          retention-days: 14
