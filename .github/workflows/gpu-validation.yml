name: Hardware GPU Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.target }}, hardware GPU)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner-os: Linux
            runner-arch: X64
          - target: windows-x64
            runner-os: Windows
            runner-arch: X64
    runs-on:
      - self-hosted
      - kwebshell-gpu
      - ${{ matrix.runner-os }}
      - ${{ matrix.runner-arch }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 probe and JDK 21 production runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned TypeScript compiler
        shell: bash
        run: npm ci

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify hardware prerequisites
        shell: bash
        run: |
          set -euo pipefail
          java -version
          cmake --version
          ninja --version
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            test -e /dev/dri/renderD128 || {
              echo "A Linux render node is required for positive GPU validation." >&2
              exit 2
            }
          else
            powershell.exe -NoProfile -NonInteractive -Command \
              "\$gpu = Get-CimInstance Win32_VideoController | Where-Object { \$_.Name -notmatch 'WARP|Basic Render Driver|Microsoft Remote Display' }; if (-not \$gpu) { throw 'A physical Windows GPU is required for positive GPU validation.' }"
          fi

      - name: Resolve pinned CEF artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(jq -er --arg target '${{ matrix.target }}' \
            '.artifacts[] | select(.target == $target)' runtime/cef-runtime.json)"
          archive="$(jq -er '.fileName' <<<"$artifact")"
          directory="${archive%.tar.bz2}"
          {
            echo "CEF_ARCHIVE=$archive"
            echo "CEF_DIRECTORY=$directory"
          } >> "$GITHUB_ENV"

      - name: Cache pinned CEF archive
        uses: actions/cache@v6
        with:
          path: .cef-ci/archives
          key: cef-gpu-${{ matrix.target }}-${{ hashFiles('runtime/cef-runtime.json') }}

      - name: Download pinned CEF archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cef-ci/archives
          archive=".cef-ci/archives/$CEF_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$archive" \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE"
          fi

      - name: Verify and extract pinned CEF archive
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :kweb-runtime-pack:verifyCefRuntimeArtifact \
            -PkwebTarget=${{ matrix.target }} \
            -PcefRuntimeArchive="$PWD/.cef-ci/archives/$CEF_ARCHIVE"
          mkdir -p .cef-ci/source
          tar -xjf ".cef-ci/archives/$CEF_ARCHIVE" -C .cef-ci/source

      - name: Run complete hardware verification
        shell: bash
        run: |
          ./gradlew --no-daemon check \
            -PcefRoot="$PWD/.cef-ci/source/$CEF_DIRECTORY" \
            -PkwebExpectHardwareGpuUnavailable=false
